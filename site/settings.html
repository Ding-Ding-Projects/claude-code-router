<!DOCTYPE html>
<html lang="en" data-md-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings · Claude Code Router</title>
  <!--build:base-->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/m3.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <a class="skip-link sr-only" href="#main-content">Skip to content</a>

  <!--
    Wave-2 mount points on THIS page (documented contract — do not rename):
      #lock-layer-slot     toy-lock wizards + lock manager
      #authenticator-slot  built-in TOTP authenticator
      #history-slot        local version-history panel
      #scheduled-slot      scheduled-settings editor
  -->
  <div id="app" class="app-shell" data-dock="left">
    <header class="topbar" role="banner">
      <a class="brand" href="./" data-i18n-aria-label="brand.aria">
        <span class="glyph" aria-hidden="true">🛤️</span><span data-i18n="brand.name">Claude Code Router</span>
      </a>
      <div class="spacer"></div>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme">
        <span class="glyph" aria-hidden="true">◐</span>
      </button>
      <select id="lang-select" class="select" style="width:auto" aria-label="Language"></select>
      <button id="notify-bell" class="icon-btn" type="button" aria-haspopup="dialog">
        <span class="glyph" aria-hidden="true">🔔</span>
        <span class="sr-only" data-i18n="notify.centre.open">Notification centre</span>
      </button>
      <button id="palette-btn" class="btn btn--text" type="button" aria-keyshortcuts="Control+Shift+F">
        <span class="glyph" aria-hidden="true">⌘</span>
        <span data-i18n="palette.open">Commands</span>
        <kbd>Ctrl+Shift+F</kbd>
      </button>
    </header>

    <nav id="tabstrip-region" class="tabstrip-region" aria-label="Site tabs"></nav>

    <main id="main-content" class="content" role="main">
      <section class="pane" id="pane-home" role="tabpanel" aria-labelledby="tab-home" tabindex="-1" hidden></section>
      <section class="pane" id="pane-docs" role="tabpanel" aria-labelledby="tab-docs" tabindex="-1" hidden></section>
      <section class="pane" id="pane-changelog" role="tabpanel" aria-labelledby="tab-changelog" tabindex="-1" hidden></section>
      <section class="pane" id="pane-download" role="tabpanel" aria-labelledby="tab-download" tabindex="-1" hidden></section>

      <section class="pane" id="pane-settings" role="tabpanel" aria-labelledby="tab-settings" tabindex="-1">
        <h1 class="headline-medium" data-i18n="settings.title">Settings</h1>
        <p class="body-medium" data-i18n="settings.intro">Everything on this site is customizable and stored locally in your browser. Nothing here leaves this machine.</p>

        <div id="settings-tabs" class="m3-tabs scroll-x" role="tablist" aria-label="Settings sections"></div>

        <div class="settings-layout" id="settings-panes">
          <section class="settings-pane" id="spane-appearance" role="tabpanel" aria-labelledby="stab-appearance" tabindex="-1"></section>
          <section class="settings-pane" id="spane-language" role="tabpanel" aria-labelledby="stab-language" tabindex="-1" hidden></section>
          <section class="settings-pane" id="spane-notifications" role="tabpanel" aria-labelledby="stab-notifications" tabindex="-1" hidden></section>
          <section class="settings-pane" id="spane-tabs" role="tabpanel" aria-labelledby="stab-tabs" tabindex="-1" hidden></section>
          <section class="settings-pane" id="spane-accessibility" role="tabpanel" aria-labelledby="stab-accessibility" tabindex="-1" hidden></section>
          <section class="settings-pane" id="spane-data" role="tabpanel" aria-labelledby="stab-data" tabindex="-1" hidden></section>
          <section class="settings-pane" id="spane-about" role="tabpanel" aria-labelledby="stab-about" tabindex="-1" hidden></section>
        </div>

        <p class="coverage-warn" id="coverage-warn" hidden role="alert"></p>
      </section>
    </main>
  </div>

  <noscript>
    <div style="padding:16px;border:2px solid var(--md-sys-color-error)">
      The settings surface needs JavaScript to render its controls.
    </div>
  </noscript>

  <div id="snackbar-region" class="snackbar-region" role="region" aria-live="polite" aria-label="Notifications"></div>
  <div id="overlay-root"></div>
</body>
</html>
