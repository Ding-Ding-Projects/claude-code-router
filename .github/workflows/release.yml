name: Release

# Build -> package -> publish. That is the whole job.
#
# By standing decision this workflow runs NO tests, NO lint and NO type or
# static-analysis gates, and nothing downstream may be withheld by a code
# quality verdict. A run fails only when building, packaging or publication
# itself fails.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Keyed on workflow + ref WITHOUT cancel-in-progress: publishing a release is
  # a side-effecting operation (tag creation, immutable assets), so an in-flight
  # run must never be cancelled mid-publish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Build & publish Windows Squirrel installer (unsigned)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Record workflow start time
        shell: bash
        run: |
          echo "WORKFLOW_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        shell: bash
        run: |
          mkdir -p build-logs
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee build-logs/npm-ci.log

      - name: Build bundled assets (repo script build:assets)
        shell: bash
        run: |
          set -o pipefail
          npm run build:assets 2>&1 | tee build-logs/build-assets.log

      - name: Package Windows Squirrel installer (repo script build:app:win:local, unsigned)
        shell: bash
        run: |
          set -o pipefail
          npm run build:app:win:local 2>&1 | tee build-logs/electron-builder.log

      - name: Verify packaged artifacts (Setup exe, RELEASES, .nupkg)
        shell: bash
        run: |
          set -euo pipefail
          out="release-local"
          shopt -s nullglob
          setups=("$out"/*Setup*.exe)
          if [ ${#setups[@]} -eq 0 ]; then setups=("$out"/*.exe); fi
          nupkgs=("$out"/*.nupkg)
          if [ ${#setups[@]} -eq 0 ]; then
            echo "::error::No installer executable was produced under $out/."
            ls -la "$out" || true
            exit 1
          fi
          if [ ! -f "$out/RELEASES" ]; then
            echo "::error::Squirrel RELEASES feed is missing under $out/."
            ls -la "$out" || true
            exit 1
          fi
          if [ ${#nupkgs[@]} -eq 0 ]; then
            echo "::error::No .nupkg package was produced under $out/."
            ls -la "$out" || true
            exit 1
          fi
          echo "Packaged artifacts verified:"
          for f in "${setups[@]}" "$out/RELEASES" "${nupkgs[@]}"; do
            printf '  %-70s %10s bytes\n' "$(basename "$f")" "$(stat -c %s "$f")"
          done

      - name: Compute unique monotonic release tag (never reused)
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}-build${GITHUB_RUN_NUMBER}"
          if git ls-remote origin "refs/tags/${tag}" | grep -q "refs/tags/${tag}$"; then
            echo "::error::Tag ${tag} already exists on the remote; refusing to reuse a release tag."
            exit 1
          fi
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "Release tag: ${tag} (commit ${GITHUB_SHA})"

      - name: Resolve dim sum code name from public catalog (best effort, never blocks)
        shell: bash
        run: |
          set -euo pipefail
          # Every release carries a dim sum code name resolved from the public
          # dim-sum-photos catalog, next unused dish in deterministic catalog
          # order, whose photo is PUBLISHED as a real release asset there. No
          # image is generated or copied into this repository; the notes link
          # the public asset URL. Any fetch failure ships the release without a
          # code name and says so - this step must never block publication.
          catalog_url="https://raw.githubusercontent.com/Ding-Ding-Projects/dim-sum-photos/main/catalog/index.json"
          if ! curl -fsSL --max-time 60 "$catalog_url" -o dim-sum-catalog.json; then
            echo "::warning::Could not fetch the dim sum catalog index (${catalog_url}); shipping this release without a code name."
            echo "DIM_SUM_NAME_EN=" >> "$GITHUB_ENV"
            rm -f dim-sum-catalog.json
            exit 0
          fi
          if ! gh api repos/Ding-Ding-Projects/dim-sum-photos/releases --paginate \
              -q '.[] | .assets[] | [.name, .browser_download_url] | @tsv' > dim-sum-assets.tsv; then
            echo "::warning::Could not list published photo assets of the public dim-sum repository; shipping this release without a code name."
            echo "DIM_SUM_NAME_EN=" >> "$GITHUB_ENV"
            rm -f dim-sum-catalog.json dim-sum-assets.tsv
            exit 0
          fi
          # Prior release titles of THIS repository: a code name is used once.
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate -q '.[].name' > dim-sum-used-titles.txt 2>/dev/null || true
          picked="$(node scripts/pick-dim-sum.mjs dim-sum-catalog.json dim-sum-assets.tsv dim-sum-used-titles.txt || true)"
          if [ -n "$picked" ]; then
            printf '%s\n' "$picked" >> "$GITHUB_ENV"
            echo "Dim sum code name resolved for this release."
          else
            echo "::warning::No unused published dim sum dish could be resolved; shipping this release without a code name."
            echo "DIM_SUM_NAME_EN=" >> "$GITHUB_ENV"
          fi
          rm -f dim-sum-catalog.json dim-sum-assets.tsv dim-sum-used-titles.txt

      - name: Write release notes (timing + line count + honesty statements)
        shell: bash
        run: |
          set -euo pipefail
          started="${WORKFLOW_STARTED_AT}"
          completed="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          duration_secs=$(( $(date -u -d "${completed}" +%s) - $(date -u -d "${started}" +%s) ))
          duration="$(printf '%02d:%02d:%02d' $((duration_secs / 3600)) $(((duration_secs % 3600) / 60)) $((duration_secs % 60)))"
          {
            echo "## Claude Code Router ${RELEASE_TAG}"
            echo
            echo "- Target commit: \`${GITHUB_SHA}\`"
            echo "- Workflow started: \`${started}\` (UTC)"
            echo "- Workflow completed: \`${completed}\` (UTC)"
            echo "- Workflow duration: \`${duration}\`"
            echo
            echo "### Installer"
            echo
            echo "Windows Squirrel.Windows build: \`*Setup*.exe\`, \`RELEASES\`, \`.nupkg\`."
            echo "**The installer is NOT code-signed.** It may trigger an unknown-publisher"
            echo "or SmartScreen warning; no signature verification is claimed."
            echo
            echo "This release is ungated by design: no tests, lint, or type checks ran in"
            echo "this workflow, and nothing gates this release on code-quality verdicts."
            echo "Whether the change behind this commit was verified locally depends entirely"
            echo "on the task that pushed it; this release makes no local-verification claim"
            echo "either way. See the commit history for what changed."
            echo
            echo "### Dim sum code name"
            echo
            if [ -n "${DIM_SUM_NAME_EN:-}" ]; then
              echo "**${DIM_SUM_NAME_EN} · ${DIM_SUM_NAME_ZH}**"
              echo
              echo "Photo (published asset of the public dim-sum catalog; linked, not copied):"
              echo "[${DIM_SUM_NAME_EN}](${DIM_SUM_PHOTO_URL})"
            else
              echo "None for this build: the public dim-sum catalog or its published photo assets were"
              echo "unreachable at build time, so this release ships with its version alone rather"
              echo "than guessing a name."
            fi
            echo
            echo "### Line count at this commit"
            echo
            echo "Produced by \`node scripts/count-lines.mjs\` over the tagged tree:"
            echo
            '```'
            node scripts/count-lines.mjs
            '```'
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub release (non-draft, unique tag)
        shell: bash
        run: |
          set -euo pipefail
          title="Claude Code Router ${RELEASE_TAG}"
          if [ -n "${DIM_SUM_NAME_EN:-}" ] && [ -n "${DIM_SUM_NAME_ZH:-}" ]; then
            title="Claude Code Router ${RELEASE_TAG} · ${DIM_SUM_NAME_EN} · ${DIM_SUM_NAME_ZH}"
          fi
          gh release create "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${title}" \
            --notes-file release-notes.md

      - name: Attach installer assets
        shell: bash
        run: |
          set -euo pipefail
          out="release-local"
          shopt -s nullglob
          setups=("$out"/*Setup*.exe)
          if [ ${#setups[@]} -eq 0 ]; then setups=("$out"/*.exe); fi
          assets=()
          for f in "${setups[@]}"; do
            assets+=("${f}#Windows installer (unsigned)")
          done
          assets+=("${out}/RELEASES#Squirrel update feed (RELEASES)")
          for f in "$out"/*.nupkg; do
            case "$(basename "$f")" in
              *-delta.nupkg) label="Squirrel delta package" ;;
              *) label="Squirrel full package" ;;
            esac
            assets+=("${f}#${label}")
          done
          gh release upload "${RELEASE_TAG}" "${assets[@]}"

      - name: Upload safe build logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7
